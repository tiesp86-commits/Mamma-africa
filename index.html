<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFRICA QUIZ 🌍</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <div class="logo">AFRICA <span>QUIZ</span> 🌍</div>
        <div id="score">Score : 0</div>
    </header>

    <!-- ACCUEIL -->
    <section id="home" class="screen active">
        <div class="hero">
            <h1>🌍 AFRICA QUIZ</h1>
            <p>
                Teste tes connaissances sur l'Afrique,
                ses peuples, son histoire et ses cultures.
            </p>

            <button id="playButton" class="main-button">
                JOUER
            </button>
        </div>
    </section>

    <!-- MODES -->
    <section id="modes" class="screen">

        <button class="back-button" onclick="showScreen('home')">
            ← Retour
        </button>

        <h2>Choisis ton mode</h2>

        <div class="modes">

            <button class="mode" onclick="startGame('Quiz Afrique')">
                🌍
                <strong>Quiz Afrique</strong>
                <small>Questions variées</small>
            </button>

            <button class="mode" onclick="startGame('Drapeaux')">
                🇨🇮
                <strong>Drapeaux</strong>
                <small>Reconnais les pays</small>
            </button>

            <button class="mode" onclick="startGame('Football')">
                ⚽
                <strong>Football africain</strong>
                <small>AFCON, joueurs et clubs</small>
            </button>

            <button class="mode" onclick="startGame('Animaux')">
                🦁
                <strong>Animaux</strong>
                <small>Faune africaine</small>
            </button>

            <button class="mode" onclick="startGame('Musique')">
                🎵
                <strong>Musique</strong>
                <small>Artistes et instruments</small>
            </button>

            <button class="mode" onclick="startGame('Cuisine')">
                🍲
                <strong>Cuisine</strong>
                <small>Plats africains</small>
            </button>

            <button class="mode" onclick="startGame('Défi Afrique')">
                🔥
                <strong>Défi Afrique</strong>
                <small>Questions difficiles</small>
            </button>

        </div>

    </section>

    <!-- QUIZ -->
    <section id="quiz" class="screen">

        <div class="quiz-header">

            <div id="level">
                🟢 Niveau 1
            </div>

            <div id="questionNumber">
                Question 1/10
            </div>

            <div id="timer">
                ⏱️ 60
            </div>

        </div>

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <div id="category"></div>

        <h2 id="question"></h2>

        <div id="answers" class="answers"></div>

        <div id="feedback" class="feedback hidden"></div>

        <button
            id="nextButton"
            class="main-button hidden">
            Question suivante →
        </button>

    </section>

    <!-- RESULTAT -->
    <section id="result" class="screen">

        <div class="result">

            <div class="trophy">
                🏆
            </div>

            <h2>Partie terminée !</h2>

            <div id="finalScore">
                0/10
            </div>

            <p id="finalMessage"></p>

            <button
                class="main-button"
                onclick="showScreen('modes')">
                REJOUER
            </button>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
